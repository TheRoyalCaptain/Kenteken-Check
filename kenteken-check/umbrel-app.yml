manifestVersion: 1
id: kenteken-check
category: utilities
name: Kenteken Check
version: "0.4.0"
tagline: Nederlandse voertuiggegevens zonder betaalmuur
description: >-
  Bekijk alle ontvangen kentekengegevens met een duidelijke status per bron:
  beschikbaar, niet beschikbaar of ophalen mislukt. De app gebruikt 32
  relevante officiële RDW-datasets en toont historische gebeurtenissen,
  typegoedkeuringsgegevens en opgeslagen waarnemingen. Een optionele externe
  API-koppeling gebruikt je eigen sleutel. Geen gegevens worden als compleet
  voorgesteld wanneer de bron ze niet levert.
releaseNotes: >-
  Aanvullende Nederlandse en Europese bronnen: Teruggeroepen.nl op exacte
  RDW-referentie, Europese modelcatalogus van autoseeker.eu met eigen
  generatiekeuze, en EEA-registratiedata op exact goedkeuringsnummer, variant
  en uitvoering via expliciet inschakelbare koppeling. Bronstatussen,
  oorspronkelijke data, bewaarde keuzes en bladeren door grote datasets.
developer: Kevin van Krugten
website: https://github.com/TheRoyalCaptain/Kenteken-Check
