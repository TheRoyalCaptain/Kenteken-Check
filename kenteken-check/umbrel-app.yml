manifestVersion: 1
id: kenteken-check
category: utilities
name: Kenteken Check
version: "0.2.0"
tagline: Nederlandse voertuiggegevens zonder betaalmuur
description: >-
  Een compact voertuigoverzicht met openbare RDW-gegevens over registratie,
  APK, tellerstandoordeel, motor, WLTP, emissies, gewichten, trekvermogen,
  keuringen, gebreken en terugroepacties. Zoek in alle gegevens, bewaar
  favorieten en vergelijk twee voertuigen. Geen betaalde API nodig.
releaseNotes: >-
  Volledig vernieuwde compacte interface met acht kerngegevens, tabbladen
  en zoeken in alle velden. Uitgebreid van zes naar twaalf RDW-datasets,
  met keuringsmeldingen, gebreken en passende omschrijvingen, ingebouwde
  objecten en terugroepacties met defect, herstelmaatregel en voertuigstatus.
  Meer motor-, energie- en WLTP-informatie in een eigen tabblad.
developer: Kevin van Krugten
