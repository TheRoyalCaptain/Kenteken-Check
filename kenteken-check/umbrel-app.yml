manifestVersion: 1
id: kenteken-check
category: utilities
name: Kenteken Check
version: "0.9.0"
tagline: Kenteken- en VIN-gegevens met duidelijke bronstatus
description: >-
  Bekijk alle ontvangen kentekengegevens met een duidelijke status per bron:
  beschikbaar, niet beschikbaar of ophalen mislukt. De app gebruikt 32
  relevante officiële RDW-datasets en toont historische gebeurtenissen,
  typegoedkeuringsgegevens en opgeslagen waarnemingen. Een optionele externe
  API-koppeling gebruikt je eigen sleutel. Geen gegevens worden als compleet
  voorgesteld wanneer de bron ze niet levert.
releaseNotes: >-
  Eigen beveiligde accounts met scrypt-wachtwoordhashes en persoonlijke
  databaseopslag; Umbrels extra toegangsscherm staat uit. Maak bij de eerste
  opening je beheeraccount aan. Bestaande servergegevens gaan naar deze
  beheerder. Opgeslagen kentekens worden door een aparte service dagelijks
  gecontroleerd. De huidige versie plus maximaal drie eerdere versies
  blijven beschikbaar. Nieuwe gebruikers beginnen met een eigen lege garage.
developer: Kevin van Krugten
website: https://github.com/TheRoyalCaptain/Kenteken-Check
