manifestVersion: 1
id: kenteken-check
category: utilities
name: Kenteken Check
version: "0.10.0"
tagline: Kenteken- en VIN-gegevens met duidelijke bronstatus
description: >-
  Bekijk alle ontvangen kentekengegevens met een duidelijke status per bron:
  beschikbaar, niet beschikbaar of ophalen mislukt. De app gebruikt 32
  relevante officiële RDW-datasets en toont historische gebeurtenissen,
  typegoedkeuringsgegevens en opgeslagen waarnemingen. Een optionele externe
  API-koppeling gebruikt je eigen sleutel. Geen gegevens worden als compleet
  voorgesteld wanneer de bron ze niet levert.
releaseNotes: >-
  Nieuw donker dossierontwerp met gegroepeerde navigatie, rustige typografie
  en een geïntegreerde voertuigsamenvatting. Persoonlijke zoekteller per
  kenteken en VIN, blijvend opgeslagen in je account. Alleen bewuste
  zoekopdrachten tellen mee; vernieuwen en dagelijkse controles niet.
  Tellers beginnen vanaf deze versie. Accounts, garage, rapporten en
  maximaal drie oude voertuigversies blijven behouden.
developer: Kevin van Krugten
